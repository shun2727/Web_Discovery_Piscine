        <!--label associates the content by grouping them using lable-->
        <!--it can be done by having an opening tag and putting the contents inside the tag "label"-->
        <!-- its advantage is tat when you click on the text associated to it, the labelable contetns will be highlighted-->
        <label for="dropdown" class="dropdown">
            <p> I </p>
            <p> like </p>
            <p> to </p>
            <p> eat </p>
            <select id="dropdown">
                    <option>Egg</option>
                    <option>Ham</option>
                    <option>Cheese</option>
            </select>  
            <p> ! </p>
        </label>

    </body>
