<!DOCTYPE html>
<html>
    <head>
        <title>ex05</title>
        <style>
            table {
                width: 10%;
                border: 1px solid black;
                border-collapse: collapse;
            }
            td {
                padding-top: 10%;
                padding-bottom: 10%;
                border: 1px solid black;
                align-items: center;
            }
            tr:nth-child(1) td:nth-child(1) {background-color: aliceblue;}
            tr:nth-child(1) td:nth-child(2) {background-color: antiquewhite;}
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td> Hello </td>
                <td> World </td>
            </tr>
        </table>
    </body>
</html>
